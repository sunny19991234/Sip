<!doctype html>
<html lang="nl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0f172a" />
    <link rel="manifest" href="./manifest.json" />
    <title>Sip — gebruik op je telefoon</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      body {
        margin: 0;
        background: linear-gradient(180deg, #020617 0%, #0f172a 100%);
        color: #e2e8f0;
      }
      .app {
        max-width: 860px;
        margin: 0 auto;
        padding: 24px;
      }
      .card {
        background: rgba(15, 23, 42, 0.92);
        border: 1px solid rgba(148, 163, 184, 0.16);
        border-radius: 20px;
        padding: 20px;
        box-shadow: 0 10px 30px rgba(2, 6, 23, 0.35);
        margin-bottom: 16px;
      }
      h1, h2, h3, p { margin-top: 0; }
      .hero {
        display: grid;
        grid-template-columns: 1.1fr 0.9fr;
        gap: 16px;
        align-items: center;
      }
      .glass {
        width: 100%;
        max-width: 220px;
        aspect-ratio: 1 / 1.2;
        margin: 0 auto;
        border-radius: 0 0 50px 50px;
        background: linear-gradient(180deg, #dbeafe 0%, #93c5fd 100%);
        border: 2px solid #60a5fa;
        position: relative;
        overflow: hidden;
      }
      .glass::before {
        content: '';
        position: absolute;
        inset: 0;
        background: linear-gradient(180deg, rgba(255,255,255,0.2) 0%, rgba(255,255,255,0) 40%);
      }
      .water {
        position: absolute;
        left: 0;
        right: 0;
        bottom: 0;
        background: linear-gradient(180deg, #38bdf8 0%, #2563eb 100%);
        transition: height 0.25s ease;
        height: 0%;
      }
      .progress-row {
        display: flex;
        justify-content: space-between;
        margin-bottom: 8px;
        font-weight: 600;
      }
      .bar {
        height: 16px;
        border-radius: 999px;
        background: #e5e7eb;
        overflow: hidden;
      }
      .fill {
        height: 100%;
        background: linear-gradient(90deg, #38bdf8 0%, #2563eb 100%);
        transition: width 0.2s ease;
        width: 0%;
      }
      .buttons {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
      }
      button {
        border: 0;
        border-radius: 999px;
        padding: 11px 14px;
        background: #38bdf8;
        color: #082f49;
        font-weight: 700;
        cursor: pointer;
      }
      button.secondary {
        background: #2563eb;
        color: white;
      }
      button.ghost {
        background: rgba(148, 163, 184, 0.16);
        color: #e2e8f0;
      }
      .stack {
        display: grid;
        gap: 8px;
      }
      .stack input {
        padding: 10px 12px;
        border-radius: 10px;
        border: 1px solid rgba(148, 163, 184, 0.25);
        min-width: 140px;
        background: rgba(15, 23, 42, 0.7);
        color: #f8fafc;
      }
      ul { padding-left: 18px; }
      li { margin-bottom: 8px; }
      .hint {
        color: #6b7280;
        font-size: 0.95rem;
      }
      .status {
        background: rgba(37, 99, 235, 0.14);
        border-radius: 12px;
        padding: 10px 12px;
        margin-bottom: 12px;
        color: #bfdbfe;
      }
      @media (max-width: 700px) {
        .hero { grid-template-columns: 1fr; }
        .app { padding: 16px; }
      }
    </style>
  </head>
  <body>
    <div class="app">
      <div class="card">
        <h1>Sip</h1>
        <p class="hint">Deze versie werkt zonder Node. Vul je Supabase-gegevens in en gebruik hem op je telefoon.</p>
      </div>

      <div class="card">
        <h2>Supabase setup</h2>
        <div class="stack">
          <input id="supabaseUrlInput" placeholder="https://<project>.supabase.co" />
          <input id="supabaseKeyInput" placeholder="anon key" />
          <div class="buttons">
            <button class="secondary" id="saveConfigBtn">Opslaan en verbinden</button>
          </div>
          <div class="field">
            <input id="authEmailInput" placeholder="Email voor login" />
            <button class="ghost" id="sendMagicLinkBtn">Stuur login link</button>
          </div>
        </div>
        <p id="statusText" class="status">Nog niet verbonden.</p>
      </div>
